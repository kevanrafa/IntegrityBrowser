[package]
name = "integrity-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Integrity Browser - a privacy-first desktop web browser with click-interception protection"

[dependencies]
integrity-core = { path = "../crates/integrity-core" }
wry = { version = "0.55.1", features = ["devtools"] }
tao = "0.35.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "2", features = ["tls"] }
dirs = "5"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
